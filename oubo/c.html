<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>職務経歴書の内容確認</title>
<style>:root {
--ink: #1f2430; --muted: #5d6577; --line: #dfe3ea; --bg: #f6f7f9; --card: #fff;
--accent: #1f5fbf; --accent-soft: #e8f0fc; --ok: #1d7a4e; --warn: #b26a00; --ng: #b3261e;
font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
color: var(--ink); background: var(--bg); line-height: 1.6;
}
* { box-sizing: border-box; }
body { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 6px 12px; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--ng); border-color: #f0c6c2; }
button.link { border: none; background: none; color: var(--accent); padding: 2px 4px; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; width: 100%; }
textarea { min-height: 72px; resize: vertical; }
label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.row > .shrink { flex: 0 0 auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
.card.nested { background: #fbfcfd; }
.muted { color: var(--muted); font-size: 13px; }
.badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid; margin-left: 6px; vertical-align: middle; }
.st-confirmed { color: var(--ok); border-color: #b8dcc8; background: #eef8f2; }
.st-sourced { color: var(--accent); border-color: #c2d5f2; background: var(--accent-soft); }
.st-needs_check { color: var(--warn); border-color: #f1d2a1; background: #fff6e8; }
.st-unknown { color: var(--muted); border-color: var(--line); background: #f3f4f6; }
h1, h2, h3, h4 { margin: .4em 0; line-height: 1.35; }
h2 { font-size: 18px; } h3 { font-size: 16px; } h4 { font-size: 15px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #233; color: #fff; padding: 8px 16px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99; font-size: 14px; }
#toast.show { opacity: .95; } #toast.ng { background: var(--ng); }
.progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); }
.example { background: #f4f6fa; border-left: 3px solid #a8b4c8; padding: 6px 10px; font-size: 13px; color: var(--muted); margin: 4px 0; }
.warn { color: var(--warn); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; background: #fff; font-size: 14px; color: var(--ink); margin: 0; }
.chip input { width: auto; margin: 0; }
.chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg label { flex: 1; margin: 0; text-align: center; padding: 6px 4px; font-size: 13px; color: var(--ink); cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: none; }
.seg input { display: none; }
.seg label:has(input:checked) { background: var(--accent); color: #fff; }
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
header.top { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; gap: 16px; align-items: center; }
header.top .brand { font-weight: 700; }
main.wrap { max-width: 1200px; margin: 0 auto; padding: 16px 20px 80px; width: 100%; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 12px 0; overflow-x: auto; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; white-space: nowrap; }
.tabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.doc-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .doc-layout { grid-template-columns: 1fr; } }
.preview { background: #fff; border: 1px solid var(--line); padding: 24px; border-radius: 6px; max-height: 80vh; overflow: auto; }
.pending { background: #fff6e8; border: 1px dashed #f1d2a1; padding: 8px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
.mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.cand { max-width: 640px; margin: 0 auto; padding: 0 14px 120px; }
.cand header { position: sticky; top: 0; background: var(--bg); padding: 12px 0 8px; z-index: 5; }
.cand .card { padding: 14px; }
.cand input, .cand select, .cand textarea { font-size: 16px; padding: 10px; }
.cand button { padding: 10px 14px; }
.cand .bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; }
.cand .bottom button { max-width: 300px; flex: 1; }
.qtag { display: inline-block; font-size: 11px; background: #fff6e8; color: var(--warn); border-radius: 4px; padding: 0 6px; margin-right: 4px; }
details > summary { cursor: pointer; color: var(--accent); font-size: 13px; }
.cand main { min-height: 50vh; }
.savestate { flex: 0 0 auto; font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid transparent; white-space: nowrap; }
.savestate:empty { display: none; }
.savestate.ok { color: var(--ok); border-color: #b8dcc8; background: #eef8f2; }
.savestate.busy { color: var(--accent); border-color: #c2d5f2; background: var(--accent-soft); }
.savestate.pending { color: var(--warn); border-color: #f1d2a1; background: #fff6e8; }
.savestate.ng { color: var(--ng); border-color: #f0c6c2; background: #fdeeee; }
.savestate button.link { padding: 0 0 0 6px; font-size: 12px; text-decoration: underline; color: var(--ng); }
.cand .bottom button { min-height: 46px; }
.cand .bottom button:disabled { opacity: .4; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.choice { min-height: 56px; font-size: 17px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.choice.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.note { background: #fff6e8; border: 1px solid #f1d2a1; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.listrow { border-bottom: 1px solid var(--line); padding: 8px 0; }
button.confirm { border-color: var(--ok); color: var(--ok); background: #fff; }
.ymmsg:empty { display: none; }
.pending-review { background: #fff6e8; border: 1px solid #f1d2a1; border-radius: 8px; padding: 10px 12px; }
.cand .hdr { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.doc { font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif; font-size: 14px; line-height: 1.75; color: #111; }
.doc h1 { text-align: center; font-size: 22px; letter-spacing: .3em; }
.doc h2 { font-size: 16px; border-bottom: 2px solid #333; margin-top: 1.6em; }
.doc h3 { font-size: 15px; background: #f0f0f0; padding: 4px 8px; margin-top: 1.2em; }
.doc h4 { font-size: 14px; margin: 1em 0 .2em; }
.doc h5 { font-size: 13px; margin: .8em 0 .2em; }
.doc .meta { color: #555; font-size: 12px; margin: 0; }
.doc table.perf { border-collapse: collapse; width: 100%; font-size: 12px; margin: 4px 0; }
.doc table.perf th, .doc table.perf td { border: 1px solid #999; padding: 3px 6px; }
.doc table.perf th { background: #f5f5f5; }
.doc tr.unconfirmed td { background: #fff6e8; }
.doc .asg { margin-left: .5em; }
</style></head>
